<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crawlable | SOTA AI Extractor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                        display: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        deep: '#060607',
                        obsidian: '#0d0d12',
                        primary: '#0ea5e9',
                        secondary: '#8b5cf6',
                        accent: '#10b981',
                        gold: '#f0a853',
                        rose: '#f472b6',
                    },
                    animation: {
                        'breathing': 'breathing 8s cubic-bezier(0.45, 0, 0.55, 1) infinite',
                        'breathing-slow': 'breathing 12s cubic-bezier(0.45, 0, 0.55, 1) infinite 2s',
                        'heartbeat-ring': 'heartbeatRing 2.2s cubic-bezier(0.25, 0, 0.35, 1) infinite',
                        'heartbeat-ring-2': 'heartbeatRing 2.2s cubic-bezier(0.25, 0, 0.35, 1) infinite 0.35s',
                        'heartbeat-ring-3': 'heartbeatRing 2.2s cubic-bezier(0.25, 0, 0.35, 1) infinite 0.7s',
                        'shimmer': 'shimmer 3s ease-in-out infinite',
                        'scan': 'scan 2.8s linear infinite',
                        'fade-in-up': 'fadeInUp 0.45s cubic-bezier(0.22, 0.61, 0.36, 1) forwards',
                        'drift-up': 'driftUp 18s linear infinite',
                        'sparkle': 'sparkle 4s ease-in-out infinite',
                        'vignette-pulse': 'vignettePulse 8s ease-in-out infinite',
                        'border-glow': 'borderGlow 3s ease-in-out infinite',
                        'chromatic-shift': 'chromaticShift 0.15s ease-out',
                    },
                    keyframes: {
                        breathing: {
                            '0%, 100%': {
                                transform: 'scale(1)',
                                opacity: '0.55'
                            },
                            '30%': {
                                transform: 'scale(1.45)',
                                opacity: '0.85'
                            },
                            '38%': {
                                transform: 'scale(1.45)',
                                opacity: '0.85'
                            },
                            '68%': {
                                transform: 'scale(0.75)',
                                opacity: '0.3'
                            },
                            '76%': {
                                transform: 'scale(0.75)',
                                opacity: '0.3'
                            },
                        },
                        heartbeatRing: {
                            '0%': {
                                transform: 'scale(1)',
                                opacity: '0.7',
                                borderWidth: '1.5px'
                            },
                            '40%': {
                                transform: 'scale(2.6)',
                                opacity: '0',
                                borderWidth: '0.3px'
                            },
                            '100%': {
                                transform: 'scale(2.6)',
                                opacity: '0',
                                borderWidth: '0.3px'
                            },
                        },
                        shimmer: {
                            '0%': {
                                backgroundPosition: '-200% 0'
                            },
                            '100%': {
                                backgroundPosition: '200% 0'
                            },
                        },
                        scan: {
                            '0%': {
                                transform: 'translateY(-100%)',
                                opacity: '0'
                            },
                            '15%': {
                                opacity: '1'
                            },
                            '85%': {
                                opacity: '1'
                            },
                            '100%': {
                                transform: 'translateY(420px)',
                                opacity: '0'
                            },
                        },
                        fadeInUp: {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(12px)',
                                filter: 'blur(4px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)',
                                filter: 'blur(0)'
                            },
                        },
                        driftUp: {
                            '0%': {
                                transform: 'translateY(0) translateX(0) rotate(0deg)',
                                opacity: '0'
                            },
                            '10%': {
                                opacity: '1'
                            },
                            '90%': {
                                opacity: '1'
                            },
                            '100%': {
                                transform: 'translateY(-400px) translateX(30px) rotate(8deg)',
                                opacity: '0'
                            },
                        },
                        sparkle: {
                            '0%, 100%': {
                                opacity: '0.2',
                                transform: 'scale(0.8)'
                            },
                            '50%': {
                                opacity: '1',
                                transform: 'scale(1.4)'
                            },
                        },
                        vignettePulse: {
                            '0%, 100%': {
                                opacity: '0.6'
                            },
                            '50%': {
                                opacity: '0.75'
                            },
                        },
                        borderGlow: {
                            '0%, 100%': {
                                borderColor: 'rgba(255,255,255,0.06)',
                                boxShadow: '0 0 0 0 rgba(14,165,233,0)'
                            },
                            '50%': {
                                borderColor: 'rgba(14,165,233,0.2)',
                                boxShadow: '0 0 30px 2px rgba(14,165,233,0.08)'
                            },
                        },
                        chromaticShift: {
                            '0%': {
                                textShadow: '0 0 0 transparent, 0 0 0 transparent'
                            },
                            '50%': {
                                textShadow: '-1px 0 0 rgba(14,165,233,0.5), 1px 0 0 rgba(240,168,83,0.5)'
                            },
                            '100%': {
                                textShadow: '0 0 0 transparent, 0 0 0 transparent'
                            },
                        },
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-deep: #060607;
            --breathing-hue: 200;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            overflow-x: hidden;
            cursor: default;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Cinematic Vignette Overlay */
        .vignette-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(6, 6, 7, 0.7) 85%, rgba(6, 6, 7, 0.95) 100%);
            animation: vignettePulse 8s ease-in-out infinite;
        }

        /* Subtle Film Grain via SVG Filter */
        .grain-overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.5'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 180px 180px;
        }

        /* Dot Grid Pattern */
        .dot-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.25;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.3) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        /* Glass Panel */
        .glass-panel {
            background: rgba(13, 13, 18, 0.65);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 60px rgba(14, 165, 233, 0.04);
        }

        /* Input Field */
        #target-path {
            letter-spacing: 0.02em;
            transition: all 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        #target-path:focus {
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2), 0 0 40px rgba(14, 165, 233, 0.1), inset 0 0 30px rgba(14, 165, 233, 0.03);
            border-color: rgba(14, 165, 233, 0.5);
        }

        /* Submit Button */
        #submit-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
            letter-spacing: 0.08em;
        }
        #submit-btn::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 14px;
            background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.25) 50%, transparent 70%);
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }
        #submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.25), 0 12px 30px rgba(0, 0, 0, 0.5);
        }
        #submit-btn:active {
            transform: translateY(1px);
            transition: all 0.1s;
        }
        #submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        #submit-btn:disabled::before {
            animation: none;
        }

        /* Terminal */
        #terminal-body {
            background: rgba(4, 4, 6, 0.7);
            position: relative;
        }
        #terminal-body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.25) 2px,
                    rgba(0, 0, 0, 0.25) 4px);
            pointer-events: none;
            z-index: 5;
            opacity: 0.4;
        }

        /* Scanner line */
        #scanner-line {
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(14, 165, 233, 0.1) 15%,
                    rgba(14, 165, 233, 0.7) 50%,
                    rgba(14, 165, 233, 0.1) 85%,
                    transparent 100%);
            height: 2px;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.6), 0 0 60px rgba(14, 165, 233, 0.2);
        }

        /* Stat Cards */
        .stat-card {
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: -60%;
            left: -60%;
            width: 80%;
            height: 200%;
            background: linear-gradient(105deg,
                    transparent 40%,
                    rgba(255, 255, 255, 0.04) 45%,
                    rgba(255, 255, 255, 0.08) 50%,
                    rgba(255, 255, 255, 0.04) 55%,
                    transparent 60%);
            transform: rotate(25deg);
            transition: all 0.7s;
            pointer-events: none;
        }
        .stat-card:hover::after {
            left: 120%;
            transition: all 0.5s;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* Breathing rings behind input */
        .breathing-ring {
            position: absolute;
            border-radius: 50%;
            border: 1.5px solid rgba(14, 165, 233, 0.25);
            pointer-events: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            animation: heartbeatRing 2.2s cubic-bezier(0.25, 0, 0.35, 1) infinite;
        }
        .breathing-ring:nth-child(2) {
            animation-delay: 0.35s;
            border-color: rgba(139, 92, 246, 0.2);
            width: 140px;
            height: 140px;
        }
        .breathing-ring:nth-child(3) {
            animation-delay: 0.7s;
            border-color: rgba(240, 168, 83, 0.18);
            width: 160px;
            height: 160px;
        }
        .breathing-ring:nth-child(4) {
            animation-delay: 1.05s;
            border-color: rgba(16, 185, 129, 0.15);
            width: 180px;
            height: 180px;
        }
        .breathing-ring:nth-child(5) {
            animation-delay: 1.4s;
            border-color: rgba(244, 114, 182, 0.1);
            width: 200px;
            height: 200px;
        }

        /* Chromatic aberration on heading */
        .chromatic-text {
            position: relative;
        }
        .chromatic-text::before {
            content: attr(data-text);
            position: absolute;
            left: 1px;
            top: 0;
            color: rgba(14, 165, 233, 0.35);
            z-index: -1;
            pointer-events: none;
            animation: chromaticShift 0.15s ease-out infinite;
            animation-play-state: paused;
        }
        .chromatic-text:hover::before {
            animation-play-state: running;
        }

        /* Completion burst particles container */
        #burst-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }
        .burst-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: burstOut 1.2s cubic-bezier(0, 0.7, 0.3, 1) forwards;
            pointer-events: none;
        }
        @keyframes burstOut {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col font-sans relative selection:bg-primary/40 selection:text-white">

    <!-- Canvas Particle System -->
    <canvas id="particle-canvas" class="fixed inset-0 z-0 pointer-events-none" aria-hidden="true"></canvas>

    <!-- Dot Grid -->
    <div class="dot-grid" aria-hidden="true"></div>

    <!-- Vignette -->
    <div class="vignette-overlay" aria-hidden="true"></div>

    <!-- Film Grain -->
    <div class="grain-overlay" aria-hidden="true"></div>

    <!-- Completion Burst Container -->
    <div id="burst-container"></div>

    <!-- Ambient Breathing Orbs (Background) -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none" aria-hidden="true">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full bg-primary/12 blur-[140px] animate-breathing"
        style="transform-origin: center center;"></div>
        <div class="absolute top-1/3 left-2/3 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] rounded-full bg-secondary/10 blur-[120px] animate-breathing-slow"
        style="transform-origin: center center;"></div>
        <div class="absolute bottom-1/4 right-1/3 -translate-x-1/2 -translate-y-1/2 w-[350px] h-[350px] rounded-full bg-gold/8 blur-[100px] animate-breathing"
        style="transform-origin: center center; animation-delay: 3s;"></div>
        <div class="absolute top-2/3 left-1/4 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] rounded-full bg-rose/6 blur-[90px] animate-breathing-slow"
        style="transform-origin: center center; animation-delay: 6s;"></div>
    </div>

    <!-- Header -->
    <header class="glass-panel sticky top-0 z-50 border-b border-white/5 backdrop-blur-xl">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="relative w-11 h-11 rounded-xl bg-gradient-to-br from-primary via-secondary to-rose flex items-center justify-center shadow-lg shadow-primary/25 group cursor-default"
                style="animation: borderGlow 3s ease-in-out infinite;">
                <!-- Inner glow orb -->
                <div class="absolute inset-1.5 rounded-lg bg-obsidian/80 backdrop-blur-sm flex items-center justify-center">
                    <span class="text-xl drop-shadow-md relative z-10">🦅</span>
                </div>
                <!-- Subtle spin ring -->
                <div class="absolute inset-[-3px] rounded-xl border border-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-700"
                style="animation: heartbeatRing 3s cubic-bezier(0.25,0,0.35,1) infinite;">
            </div>
        </div>
        <div>
            <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-3">
                <span class="chromatic-text" data-text="Crawlable">Crawlable</span>
                <span class="text-primary text-[10px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-full bg-primary/10 border border-primary/20"
                style="animation: borderGlow 3s ease-in-out infinite 0.5s;">
                SOTA Engine
            </span>
        </h1>
    </div>
</div>
<div class="flex items-center space-x-3 bg-white/5 px-3 py-1.5 rounded-full border border-white/5 backdrop-blur-md">
    <span id="status-indicator" class="flex h-2.5 w-2.5 relative">
        <span id="status-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-gray-400 opacity-75"></span>
        <span id="status-dot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-gray-400"></span>
    </span>
    <span id="status-text" class="text-xs text-gray-400 font-medium tracking-wide uppercase">Idle</span>
</div>
</div>
</header>

<!-- Main Content -->
<main class="flex-grow max-w-5xl mx-auto px-6 py-10 w-full flex flex-col gap-8 z-10 relative">

    <!-- Input Panel with Breathing Rings -->
    <div id="input-container" class="glass-panel rounded-2xl p-8 shadow-2xl relative transition-all duration-700 group"
    style="overflow: visible;">
    <!-- Breathing Rings Behind the Panel -->
    <div class="absolute inset-0 pointer-events-none overflow-visible" style="z-index: -1;" aria-hidden="true">
        <div class="breathing-ring" style="width:200px;height:200px;top:50%;left:50%;margin-left:-100px;margin-top:-100px;"></div>
        <div class="breathing-ring" style="width:230px;height:230px;top:50%;left:50%;margin-left:-115px;margin-top:-115px;"></div>
        <div class="breathing-ring" style="width:260px;height:260px;top:50%;left:50%;margin-left:-130px;margin-top:-130px;"></div>
        <div class="breathing-ring" style="width:290px;height:290px;top:50%;left:50%;margin-left:-145px;margin-top:-145px;"></div>
        <div class="breathing-ring" style="width:320px;height:320px;top:50%;left:50%;margin-left:-160px;margin-top:-160px;"></div>
    </div>

    <!-- Glow accent behind the panel -->
    <div class="absolute inset-0 rounded-2xl bg-gradient-to-br from-primary/5 via-transparent to-secondary/5 opacity-0 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none"
    style="filter: blur(40px); z-index: -1;"></div>

    <div class="mb-6 relative z-10">
        <h2 class="text-2xl font-bold text-white tracking-tight mb-1">Target Directory</h2>
        <p class="text-sm text-gray-400 font-light tracking-wide">Inject absolute path for AI-driven contextual extraction.</p>
    </div>

    <form id="extraction-form" class="flex gap-4 relative z-10">
        <div class="relative flex-grow group/input">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-500 transition-colors duration-500 group-hover/input:text-primary/70"
                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
            </svg>
        </div>
        <input type="text" id="target-path" placeholder="e.g., /Users/dev/src or C:\Projects\App"
        class="w-full bg-black/40 border border-white/10 text-gray-100 rounded-xl pl-12 pr-4 py-4 focus:outline-none font-mono text-sm shadow-inner placeholder-gray-600"
        required>
    </div>
    <button type="submit" id="submit-btn"
    class="relative overflow-hidden bg-white text-black hover:bg-gray-100 font-bold px-8 py-4 rounded-xl flex items-center justify-center min-w-[160px] shadow-[0_0_25px_rgba(255,255,255,0.18)] hover:shadow-[0_0_40px_rgba(255,255,255,0.35)] transition-all duration-500"
>
<span id="btn-text" class="relative z-10 tracking-widest text-sm">INITIALIZE</span>
<svg id="btn-spinner" class="animate-spin relative z-10 h-5 w-5 text-black hidden" xmlns="http://www.w3.org/2000/svg"
fill="none" viewBox="0 0 24 24">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" fill="currentColor"

</path>
</svg>
</button>
</form>
</div>

<!-- Terminal Output -->
<div id="terminal-container"
class="flex-grow flex flex-col glass-panel rounded-2xl shadow-2xl overflow-hidden relative transition-all duration-500 border border-white/5 group/terminal">
<!-- Scanning Laser Effect -->
<div id="scanner-line"
class="absolute top-0 left-0 w-full hidden pointer-events-none z-20 rounded-full"
style="height: 2px;"></div>

<div class="bg-black/40 px-6 py-3 border-b border-white/5 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
        <div class="w-3 h-3 rounded-full bg-red-500/80 shadow-[0_0_6px_rgba(239,68,68,0.6)] transition-all duration-500 hover:shadow-[0_0_12px_rgba(239,68,68,0.9)]"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-500/80 shadow-[0_0_6px_rgba(234,179,8,0.6)] transition-all duration-500 hover:shadow-[0_0_12px_rgba(234,179,8,0.9)]"></div>
        <div class="w-3 h-3 rounded-full bg-green-500/80 shadow-[0_0_6px_rgba(34,197,94,0.6)] transition-all duration-500 hover:shadow-[0_0_12px_rgba(34,197,94,0.9)]"></div>
        <span class="ml-4 text-xs font-mono text-gray-500 uppercase tracking-widest">System_Stdout</span>
    </div>
    <span class="text-[10px] text-gray-600 font-mono tracking-wider opacity-0 group-hover/terminal:opacity-100 transition-opacity duration-500">NEURAL_LOG</span>
</div>
<div id="terminal-body"
class="p-6 font-mono text-[13px] text-gray-300 overflow-y-auto flex-grow h-[400px] whitespace-pre-wrap leading-relaxed relative">
<span class="text-gray-600 opacity-50 italic">Awaiting execution matrix...</span>
</div>
</div>

<!-- Success Dashboard -->
<div id="summary-panel" class="hidden grid grid-cols-3 gap-6 transform transition-all duration-700 translate-y-4 opacity-0">
    <div class="stat-card glass-panel border-t-2 border-t-secondary rounded-2xl p-6 text-center relative overflow-hidden group/card cursor-default">
        <div class="relative z-10">
            <p class="text-gray-400 text-xs font-bold uppercase tracking-widest mb-2">Noise Filtered</p>
            <p id="stat-exclusions" class="text-5xl font-light text-white font-mono tabular-nums">0</p>
            <div class="mt-3 h-0.5 w-8 mx-auto rounded-full bg-secondary/30 group-hover/card:w-16 transition-all duration-500"></div>
        </div>
    </div>
    <div class="stat-card glass-panel border-t-2 border-t-primary rounded-2xl p-6 text-center relative overflow-hidden group/card cursor-default">
        <div class="relative z-10">
            <p class="text-gray-400 text-xs font-bold uppercase tracking-widest mb-2">Code Ingested</p>
            <p id="stat-files" class="text-5xl font-light text-primary font-mono tabular-nums drop-shadow-[0_0_18px_rgba(14,165,233,0.4)]">0</p>
            <div class="mt-3 h-0.5 w-8 mx-auto rounded-full bg-primary/30 group-hover/card:w-16 transition-all duration-500"></div>
        </div>
    </div>
    <div class="stat-card glass-panel border-t-2 border-t-accent rounded-2xl p-6 text-center relative overflow-hidden group/card cursor-default">
        <div class="relative z-10">
            <p class="text-gray-400 text-xs font-bold uppercase tracking-widest mb-2">Configs Mapped</p>
            <p id="stat-configs" class="text-5xl font-light text-accent font-mono tabular-nums drop-shadow-[0_0_18px_rgba(16,185,129,0.4)]">0</p>
            <div class="mt-3 h-0.5 w-8 mx-auto rounded-full bg-accent/30 group-hover/card:w-16 transition-all duration-500"></div>
        </div>
    </div>
</div>
</main>

<script>
    (function() {
        // ─────────────────────────────────────
        // PARTICLE CANVAS SYSTEM
        // ─────────────────────────────────────
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const PARTICLE_COUNT = 90;
        const CONNECTION_DIST = 130;
        let mouseX = -1000;
        let mouseY = -1000;
        let burstParticles = [];
        let burstActive = false;
        let burstTimer = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.reset();
                // Randomize initial position
                this.y = Math.random() * canvas.height;
                this.x = Math.random() * canvas.width;
                this.life = Math.random();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20 + Math.random() * 80;
                this.size = Math.random() * 2.2 + 0.6;
                this.speedY = -(Math.random() * 0.35 + 0.12);
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.wobbleAmp = Math.random() * 50 + 20;
                this.wobbleSpeed = Math.random() * 0.004 + 0.002;
                this.wobbleOffset = Math.random() * Math.PI * 2;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.sparklePhase = Math.random() * Math.PI * 2;
                this.sparkleSpeed = Math.random() * 0.03 + 0.008;
                this.hue = [210, 260, 35, 330, 170][Math.floor(Math.random() * 5)]; // cyan, violet, gold, rose, emerald
                this.life = 0;
            }
            update(time) {
                this.life += 0.003;
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * 0.15;
                this.sparklePhase += this.sparkleSpeed;
                if (this.y < -30 || this.life > 3.5) {
                    this.reset();
                    this.y = canvas.height + 20 + Math.random() * 60;
                    this.life = 0;
                }
                // Wrap horizontally
                if (this.x < -20) this.x = canvas.width + 20;
                if (this.x > canvas.width + 20) this.x = -20;
            }
            draw(ctx, time) {
                const sparkle = Math.sin(this.sparklePhase) * 0.5 + 0.5;
                const alpha = this.opacity * (0.6 + sparkle * 0.4);
                const size = this.size * (0.7 + sparkle * 0.3);

                // Glow
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, size * 5);
                gradient.addColorStop(0, `hsla(${this.hue}, 80%, 70%, ${alpha})`);
                gradient.addColorStop(0.5, `hsla(${this.hue}, 60%, 55%, ${alpha * 0.3})`);
                gradient.addColorStop(1, `hsla(${this.hue}, 40%, 40%, 0)`);
                ctx.beginPath();
                ctx.arc(this.x, this.y, size * 5, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Core
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 30%, 90%, ${alpha * 1.3})`;
                ctx.fill();
            }
        }

        // Initialize particles
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const p = new Particle();
            p.y = Math.random() * canvas.height;
            p.x = Math.random() * canvas.width;
            particles.push(p);
        }

        function drawConnections(ctx, particles, time) {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONNECTION_DIST) {
                        const alpha = (1 - dist / CONNECTION_DIST) * 0.1;
                        const midHue = (particles[i].hue + particles[j].hue) / 2;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `hsla(${midHue}, 50%, 65%, ${alpha})`;
                        ctx.lineWidth = 0.4;
                        ctx.stroke();
                    }
                }
            }
        }

        function triggerBurst(x, y) {
            burstActive = true;
            burstTimer = 0;
            const count = 50;
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + Math.random() * 0.2;
                const speed = Math.random() * 4 + 2;
                burstParticles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    size: Math.random() * 3 + 1,
                    hue: [210, 260, 35, 170, 330][Math.floor(Math.random() * 5)],
                });
            }
        }

        function updateBurstParticles() {
            for (let i = burstParticles.length - 1; i >= 0; i--) {
                const bp = burstParticles[i];
                bp.x += bp.vx;
                bp.y += bp.vy;
                bp.life -= 0.025;
                bp.vx *= 0.98;
                bp.vy *= 0.98;
                if (bp.life <= 0) {
                    burstParticles.splice(i, 1);
                }
            }
            if (burstParticles.length === 0) burstActive = false;
        }

        function drawBurstParticles(ctx) {
            for (const bp of burstParticles) {
                const alpha = bp.life;
                const gradient = ctx.createRadialGradient(bp.x, bp.y, 0, bp.x, bp.y, bp.size * 6);
                gradient.addColorStop(0, `hsla(${bp.hue}, 80%, 75%, ${alpha})`);
                gradient.addColorStop(0.4, `hsla(${bp.hue}, 60%, 55%, ${alpha * 0.5})`);
                gradient.addColorStop(1, `hsla(${bp.hue}, 40%, 40%, 0)`);
                ctx.beginPath();
                ctx.arc(bp.x, bp.y, bp.size * 6, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(bp.x, bp.y, bp.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${bp.hue}, 20%, 95%, ${alpha})`;
                ctx.fill();
            }
        }

        function animate(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update & draw particles
            for (const p of particles) {
                p.update(time);
                p.draw(ctx, time);
            }

            // Draw connections
            drawConnections(ctx, particles, time);

            // Burst particles
            if (burstActive) {
                updateBurstParticles();
                drawBurstParticles(ctx);
            }

            // Subtle mouse glow
            if (mouseX > 0 && mouseY > 0 && !burstActive) {
                const glow = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 180);
                glow.addColorStop(0, 'rgba(14,165,233,0.06)');
                glow.addColorStop(0.5, 'rgba(14,165,233,0.02)');
                glow.addColorStop(1, 'rgba(14,165,233,0)');
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 180, 0, Math.PI * 2);
                ctx.fillStyle = glow;
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        document.addEventListener('mouseleave', () => {
            mouseX = -1000;
            mouseY = -1000;
        });

        // Start animation
        requestAnimationFrame(animate);

        // Expose burst trigger
        window._triggerBurst = function(x, y) {
            triggerBurst(x || window.innerWidth / 2, y || window.innerHeight / 2);
        };

        // Also trigger burst on the DOM burst container
        window._triggerDOMBurst = function(originX, originY) {
            const container = document.getElementById('burst-container');
            const count = 35;
            const colors = ['#0ea5e9', '#8b5cf6', '#f0a853', '#10b981', '#f472b6', '#ffffff'];
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'burst-particle';
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 200 + 60;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                particle.style.cssText = `
                    left: ${originX}px;
                    top: ${originY}px;
                    width: ${Math.random() * 5 + 2}px;
                    height: ${Math.random() * 5 + 2}px;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    --tx: ${tx}px;
                    --ty: ${ty}px;
                    animation-duration: ${Math.random() * 0.8 + 0.7}s;
                    box-shadow: 0 0 ${Math.random() * 8 + 4}px currentColor;
                `;
                container.appendChild(particle);
                setTimeout(() => particle.remove(), 1400);
            }
        };
    })();

    // ─────────────────────────────────────
    // APP LOGIC
    // ─────────────────────────────────────
    const form = document.getElementById('extraction-form');
    const input = document.getElementById('target-path');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const terminalBody = document.getElementById('terminal-body');
    const terminalContainer = document.getElementById('terminal-container');
    const scannerLine = document.getElementById('scanner-line');
    const summaryPanel = document.getElementById('summary-panel');
    const inputContainer = document.getElementById('input-container');
    const statusPing = document.getElementById('status-ping');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    let eventSource = null;

    function animateValue(obj, start, end, duration) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            // Custom easing: overshoot bounce
            const c = 1.70158;
            const n = 1 + c;
            const easeOutBack = 1 + n * Math.pow(progress - 1, 3) + c * Math.pow(progress - 1, 2);
            const val = Math.floor(easeOutBack * (end - start) + start);
            obj.innerHTML = Math.max(0, val);
            if (progress < 1) {
                window.requestAnimationFrame(step);
            } else {
                obj.innerHTML = end;
            }
        };
        window.requestAnimationFrame(step);
    }

    function appendLog(message, isHTML = false) {
        if (terminalBody.innerHTML.includes("Awaiting execution matrix")) {
            terminalBody.innerHTML = "";
        }
        const line = document.createElement('div');
        line.className = 'mb-2 opacity-0 animate-fade-in-up';
        if (isHTML) {
            line.innerHTML = message;
        } else {
            line.textContent = message;
        }
        terminalBody.appendChild(line);
        terminalBody.scrollTop = terminalBody.scrollHeight;
    }

    function setSystemStatus(state) {
        if (state === 'processing') {
            statusPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75";
            statusDot.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-primary shadow-[0_0_10px_rgba(14,165,233,0.9)]";
            statusText.textContent = "Extracting";
            statusText.className = "text-xs text-primary font-bold tracking-wide uppercase";

            inputContainer.classList.add('border-primary/40');
            inputContainer.style.boxShadow = '0 0 50px rgba(14,165,233,0.12), 0 8px 40px rgba(0,0,0,0.5)';
            scannerLine.classList.remove('hidden');
            scannerLine.classList.add('animate-scan');

            input.disabled = true;
            submitBtn.disabled = true;
            btnText.classList.add('hidden');
            btnSpinner.classList.remove('hidden');

            summaryPanel.classList.add('hidden', 'opacity-0', 'translate-y-4');

        } else if (state === 'success') {
            statusPing.className = "hidden";
            statusDot.className =
                "relative inline-flex rounded-full h-2.5 w-2.5 bg-accent shadow-[0_0_14px_rgba(16,185,129,0.9)]";
            statusText.textContent = "Complete";
            statusText.className = "text-xs text-accent font-bold tracking-wide uppercase";

            inputContainer.classList.remove('border-primary/40');
            inputContainer.style.boxShadow = '0 0 40px rgba(16,185,129,0.08), 0 8px 40px rgba(0,0,0,0.5)';
            inputContainer.classList.add('border-accent/20');
            scannerLine.classList.add('hidden');
            scannerLine.classList.remove('animate-scan');

            input.disabled = false;
            submitBtn.disabled = false;
            btnText.classList.remove('hidden');
            btnSpinner.classList.add('hidden');

        } else {
            statusPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-gray-400 opacity-75";
            statusDot.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-gray-400";
            statusText.textContent = "Idle";
            statusText.className = "text-xs text-gray-400 font-medium tracking-wide uppercase";

            inputContainer.classList.remove('border-primary/40', 'border-accent/20');
            inputContainer.style.boxShadow = '';
            scannerLine.classList.add('hidden');
            scannerLine.classList.remove('animate-scan');

            input.disabled = false;
            submitBtn.disabled = false;
            btnText.classList.remove('hidden');
            btnSpinner.classList.add('hidden');
        }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const path = input.value.trim();
        if (!path) return;

        terminalBody.innerHTML = "";
        setSystemStatus('processing');

        appendLog(
            `<span class="text-primary font-bold">▶ EXEC_PATH:</span> <span class="text-white font-medium">${path}</span>`,
            true);
        appendLog(`<span class="text-gray-500 italic">Initializing concurrent neural pipelines...</span>`, true);

        const encodedPath = encodeURIComponent(path);
        eventSource = new EventSource(`/api/extract?target_path=${encodedPath}`);

        eventSource.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'log') {
                let styledMsg = data.message
                    .replace(/Phase \d+/g, match =>
                        `<span class="text-secondary font-bold tracking-wide">${match}</span>`)
                    .replace(/\bAI\b/g,
                        '<span class="text-primary font-bold drop-shadow-[0_0_6px_rgba(14,165,233,0.5)]">AI</span>'
                        );
                appendLog(
                    `<span class="text-primary/50 mr-2 select-none">⟐</span> <span class="text-gray-300">${styledMsg}</span>`,
                    true);
            } else if (data.type === 'error') {
                appendLog(
                    `<span class="text-red-500 font-bold bg-red-500/10 px-2 py-1 rounded inline-block">✖ FATAL ERROR:</span> <span class="text-red-400">${data.message}</span>`,
                    true);
                setSystemStatus('idle');
                eventSource.close();
            } else if (data.type === 'complete') {
                appendLog(``, true);
                appendLog(
                    `<span class="text-accent font-bold text-lg drop-shadow-[0_0_10px_rgba(16,185,129,0.6)] tracking-wide">✓ EXTRACTION COMPLETE</span>`,
                    true);
                appendLog(
                    `ARTIFACT SAVED TO: <span class="text-white bg-white/10 px-2 py-1 rounded border border-white/20 font-medium">${data.output_dir}</span>`,
                    true);

                setSystemStatus('success');

                // Trigger bursts
                const rect = terminalContainer.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                if (window._triggerBurst) window._triggerBurst(cx, cy);
                if (window._triggerDOMBurst) window._triggerDOMBurst(cx, cy);

                // Reveal reward dashboard
                summaryPanel.classList.remove('hidden');
                setTimeout(() => {
                    summaryPanel.classList.remove('opacity-0', 'translate-y-4');
                    // Staggered dopamine count-up
                    animateValue(document.getElementById('stat-exclusions'), 0, data
                        .exclusions_count, 1600);
                    setTimeout(() => {
                        animateValue(document.getElementById('stat-files'), 0, data
                            .code_files_count, 1400);
                    }, 180);
                    setTimeout(() => {
                        animateValue(document.getElementById('stat-configs'), 0, data
                            .config_files_count, 1500);
                    }, 360);
                }, 60);

                eventSource.close();
            }
        };

        eventSource.onerror = () => {
            appendLog(
                `<span class="text-red-500 font-bold">✖ CONNECTION SEVERED:</span> <span class="text-gray-400">Link to localhost lost.</span>`,
                true);
            setSystemStatus('idle');
            eventSource.close();
        };
    });

    // Keyboard shortcut: Cmd/Ctrl + Enter to submit
    document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
            if (document.activeElement === input && !submitBtn.disabled) {
                form.dispatchEvent(new Event('submit', { cancelable: true }));
            }
        }
    });
</script>
</body>
